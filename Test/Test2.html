<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Watch Product Card</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">

  <!-- Product Card -->
  <div class="max-w-sm rounded-2xl overflow-hidden shadow-lg p-4 bg-white">
    <img
      class="w-full h-48 object-cover rounded-lg"
      src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?auto=format&fit=crop&w=500&q=80"
      alt="Smart Watch"
    />
    <div class="mt-4">
      <h2 class="text-lg font-bold">Smart Watch</h2>
      <p class="text-gray-600 mt-1">Stylish smartwatch with fitness tracking features</p>
      <div class="flex items-center justify-between mt-3">
        <span class="text-xl font-semibold text-green-600">₹1999</span>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
          Add to Cart
        </button>
      </div>
    </div>
  </div>

</body>
</html>
