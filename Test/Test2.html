<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautiful Product Card</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-gradient-to-r from-gray-100 to-gray-200">

  <!-- Product Card -->
  <div class="max-w-xs bg-white rounded-2xl shadow-xl overflow-hidden hover:shadow-2xl transition duration-300">
    <!-- Product Image -->
    <div class="relative">
      <img
        src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?auto=format&fit=crop&w=500&q=80"
        alt="Smart Watch"
        class="w-full h-56 object-cover"
      />
      <span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-3 py-1 rounded-full">New</span>
    </div>

    <!-- Product Details -->
    <div class="p-5">
      <h2 class="text-xl font-bold text-gray-800">Smart Watch</h2>
      <p class="text-sm text-gray-500 mt-2">
        Stylish smartwatch with fitness tracking features, heart rate monitoring, and long battery life.
      </p>

      <!-- Price & Button -->
      <div class="flex items-center justify-between mt-5">
        <span class="text-2xl font-bold text-green-600">₹1999</span>
        <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
          Add to Cart
        </button>
      </div>
    </div>
  </div>

</body>
</html>
