<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beautiful Product Card</title>
  <title>Beautiful Product Card</title>
  <title>Beautiful Product Card</title>
  <title>Beautiful Product Card</title>
  <title>Beautiful Product Card</title>
  <title>Beautiful Product Card</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-gradient-to-r from-gray-100 to-gray-200">

  <!-- Product Card -->
  <div class="max-w-sm w-full bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300">
    
    <!-- Product Image -->
    <div class="relative">
      <img
        class="w-full h-56 object-cover"
        src="https://images.unsplash.com/photo-1580894908361-967195033f2d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
        alt="Wireless Headphones"
      />
      <span class="absolute top-3 left-3 bg-red-500 text-white text-xs px-3 py-1 rounded-full">Hot</span>
    </div>

    <!-- Product Details -->
    <div class="p-5">
      <h2 class="text-xl font-bold text-gray-800">Wireless Headphones</h2>
      <p class="text-sm text-gray-500 mt-2">
        Experience premium sound quality with active noise cancellation and deep bass.
      </p>

      <!-- Price & Button -->
      <div class="flex items-center justify-between mt-5">
        <span class="text-2xl font-bold text-green-600">₹2999</span>
        <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
          Buy Now
        </button>
      </div>
    </div>
  </div>

</body>
</html>
