<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Card</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">

  <div class="max-w-sm rounded-2xl overflow-hidden shadow-lg p-4 bg-white">
    <img
      class="w-full h-48 object-cover rounded-lg"
      src="https://images.unsplash.com/photo-1580894908361-967195033f2d?auto=format&fit=crop&w=500&q=80"
      alt="Wireless Headphones"
    />
    <div class="mt-4">
      <h2 class="text-lg font-bold">Wireless Headphones</h2>
      <p class="text-gray-600 mt-1">High-quality sound with noise cancellation</p>
      <div class="flex items-center justify-between mt-3">
        <span class="text-xl font-semibold text-green-600">₹2999</span>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
          Buy Now
        </button>
      </div>
    </div>
  </div>

</body>
</html>
